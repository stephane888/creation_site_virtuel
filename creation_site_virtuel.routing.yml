creation_site_virtuel.model_choisie_form:
  path: '/creation-site-virtuel/form/model-choisie'
  defaults:
    _form: '\Drupal\creation_site_virtuel\Form\ModelChoisieForm'
    _title: 'ModelChoisieForm'
  requirements:
    _access: 'TRUE'
    

creation_site_virtuel.entreprise:
  path: '/creation-site-virtuel/config'
  defaults:
    _form: '\Drupal\creation_site_virtuel\Form\CreationSiteVirtuelSettings'
    _title: 'creation_site_virtuel config headers & footers'
  requirements:
    _role: 'administrator'
  options:
    _admin_route: TRUE
   
creation_site_virtuel.duplicate_page:
  path: '/creation-site-virtuel/site_internet_entity/{site_internet_entity}/duplicate-page'
  defaults:
    _title: 'Dupliquer la page'
    _controller: '\Drupal\creation_site_virtuel\Controller\CreationSiteVirtuelController::duplicatePage'
  requirements:
    _role: 'administrator'
  options:
    _admin_route: TRUE
    
creation_site_virtuel.duplicate_blocks_contents:
  path: '/creation-site-virtuel/blocks_contents/{blocks_contents}/duplicate-page'
  defaults:
    _title: 'Dupliquer la page'
    _controller: '\Drupal\creation_site_virtuel\Controller\CreationSiteVirtuelController::duplicateBlocks_contents'
  requirements:
    _role: 'administrator'
  options:
    _admin_route: TRUE

creation_site_virtuel.duplicate_node:
  path: '/creation-site-virtuel/node/{node}/duplicate-page'
  defaults:
    _title: 'Dupliquer la page'
    _controller: '\Drupal\creation_site_virtuel\Controller\CreationSiteVirtuelController::duplicateNode'
  requirements:
    _role: 'administrator'
  options:
    _admin_route: TRUE

creation_site_virtuel.language:
  path: '/admin/config/domain/language/{domain}/edit'
  defaults:
    _form: '\Drupal\domain_language\Form\DomainLanguageForm'
    _title: 'Edit domain language settings'
  requirements:
    _role: 'gerant_de_site_web+administrator'
  options:
    parameters:
      domain:
        type: 'entity:domain'
